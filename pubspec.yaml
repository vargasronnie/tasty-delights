name: tasty_delights
description: A food delivery e-commerce application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  intl: ^0.20.2
  cached_network_image: ^3.3.0
  provider: ^6.1.1
  device_preview: ^1.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/